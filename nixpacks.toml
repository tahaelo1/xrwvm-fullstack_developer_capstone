[phases.setup]
nixPkgs = ["nodejs", "python311"]

[phases.build]
cmds = [
  "cd server/frontend && npm install && CI=false npm run build",
  "cd server && pip install -r requirements.txt && python manage.py collectstatic --noinput"
]

[start]
cmd = "cd server && python manage.py migrate && gunicorn djangoproj.wsgi --bind 0.0.0.0:$PORT"