name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r server/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 server/djangoapp --max-line-length=120 --exclude=migrations --ignore=E501,W503,E302,E303,W291,W293,E231,E225,E711,W292

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: |
          cd server/frontend
          npm install

    - name: Build React app
        run: |
          cd server/frontend
          CI=false npm run build